name: WATCHLIST
options:
  bundleIdPrefix: se.niklas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: WATCHLIST
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  WATCHLIST:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.niklas.watchlist
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_TMDBAccessToken: "$(TMDB_ACCESS_TOKEN)"
  WATCHLISTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WATCHLIST
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.niklas.watchlist.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WATCHLIST:
    build:
      targets:
        WATCHLIST: all
    test:
      targets:
        - WATCHLISTTests
