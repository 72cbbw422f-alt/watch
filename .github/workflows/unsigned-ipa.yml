name: Prepare unsigned iOS IPA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project WATCHLIST.xcodeproj \
            -scheme WATCHLIST \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/WATCHLIST.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Watchlist-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Watchlist-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-unsigned-ipa
          path: Watchlist-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
