name: Prepare iOS IPA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: watchlist-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project WATCHLIST.xcodeproj \
            -scheme WATCHLIST \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/WATCHLIST.app"
          test -d "$APP_PATH"
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/
          cd build/unsigned
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Watchlist-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Watchlist-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-unsigned-ipa
          path: Watchlist-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Check signing configuration
        id: signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [[ -n "$IOS_P12_BASE64" && -n "$IOS_P12_PASSWORD" && -n "$IOS_PROVISION_PROFILE_BASE64" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; unsigned IPA is still available."
          fi

      - name: Import signing certificate and profile
        if: steps.signing.outputs.available == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/watchlist-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain-password"
          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          if /usr/libexec/PlistBuddy -c 'Print ProvisionsAllDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            EXPORT_METHOD=enterprise
          else
            EXPORT_METHOD=ad-hoc
          fi

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Apple (Distribution|Development):/ {print $2; exit}')
          test -n "$IDENTITY"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "EXPORT_METHOD=$EXPORT_METHOD" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing assets imported. Profile: $PROFILE_NAME; export method: $EXPORT_METHOD"

      - name: Archive signed iOS app
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project WATCHLIST.xcodeproj \
            -scheme WATCHLIST \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WATCHLIST.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

      - name: Export signed IPA
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>se.niklas.watchlist</key><string>$PROFILE_UUID</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WATCHLIST.xcarchive" \
            -exportPath "$RUNNER_TEMP/signed-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH=$(find "$RUNNER_TEMP/signed-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          cp "$IPA_PATH" Watchlist-signed.ipa
          test -s Watchlist-signed.ipa

      - name: Verify signed IPA
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed-check"
          cd "$RUNNER_TEMP/signed-check"
          unzip -q "$GITHUB_WORKSPACE/Watchlist-signed.ipa"
          APP="Payload/WATCHLIST.app"
          test -d "$APP"
          test -f "$APP/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'se.niklas.watchlist'

      - name: Upload signed IPA
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-signed-ipa
          path: Watchlist-signed.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/watchlist-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/keychain-password"
