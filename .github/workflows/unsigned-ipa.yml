name: Build Watchlist IPA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: watchlist-ipa-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-ipa:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project WATCHLIST.xcodeproj \
            -scheme WATCHLIST \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/WATCHLIST.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Watchlist.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Watchlist.ipa"

      - name: Verify IPA structure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-check"
          cd "$RUNNER_TEMP/ipa-check"
          unzip -q "$GITHUB_WORKSPACE/Watchlist.ipa"
          APP="Payload/WATCHLIST.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'se.niklas.watchlist'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | grep -Fx '17.0'
          file "$APP/WATCHLIST" | grep -q 'arm64'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-ipa
          path: Watchlist.ipa
          if-no-files-found: error
          retention-days: 14
