name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: xcodebuild -project WATCHLIST.xcodeproj -scheme WATCHLIST -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: Run unit tests on an available iPhone Simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d.get("name","").startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Running tests on simulator $DEVICE_ID"
          xcodebuild -project WATCHLIST.xcodeproj -scheme WATCHLIST -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
